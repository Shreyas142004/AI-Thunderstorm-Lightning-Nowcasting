<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration — AeroCast AI Karnataka Nowcasting</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" id="aerocastCss" href="/static/css/style.css?v=single_tg_v17">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('aerocast_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body data-theme="light">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('aerocast_theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <div class="app-wrapper">

    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand">
        <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
          <div class="brand-glyph">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
              <path d="m13 10-3 5h4l-2 5"/>
            </svg>
          </div>
          <div>
            <div class="brand-title-row">
              <h1 class="brand-title">AeroCast AI</h1>
              <span class="brand-badge">Karnataka Nowcast</span>
            </div>
            <span class="brand-sub">New User Registration Portal</span>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <!-- Link to Login -->
        <a href="/login" class="nav-about-btn" title="Sign In to Existing Account">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>Sign In</span>
        </a>

        <!-- Link to About Page -->
        <a href="/about" class="nav-about-btn" title="About the Project">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span>About</span>
        </a>

        <!-- Theme Toggle Switch -->
        <div class="theme-switch-container">
          <button class="theme-switch-btn active" id="btnLight" onclick="setAppTheme('light')" title="Warm Beige Theme">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
          </button>
          <button class="theme-switch-btn" id="btnDark" onclick="setAppTheme('dark')" title="Espresso Dark Theme">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Authentication Page Body -->
    <main class="auth-page-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-brand-glyph">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
          </div>
          <h2 class="auth-title">Create Account</h2>
          <p class="auth-subtitle">Register for Karnataka convective alerts & localized nowcasting</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlertBox" class="auth-alert-box{% if error %} auth-alert-error{% endif %}" style="{% if error %}display: block;{% else %}display: none;{% endif %}">
          {% if error %}{{ error }}{% endif %}
        </div>

        <form id="registerForm" class="auth-form" onsubmit="handleRegisterSubmit(event)">
          <!-- 1. Username Field -->
          <div class="form-group">
            <label for="regUsername" class="form-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Username
            </label>
            <div class="form-input-wrap">
              <input 
                type="text" 
                id="regUsername" 
                name="username" 
                class="form-input" 
                placeholder="e.g. Shreyas R A" 
                required 
                autocomplete="name"
              >
            </div>
          </div>

          <!-- 2. Mobile Number Field -->
          <div class="form-group">
            <label for="regMobile" class="form-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Mobile Number
            </label>
            <div class="form-input-wrap">
              <span class="form-input-prefix">+91</span>
              <input 
                type="tel" 
                id="regMobile" 
                name="mobile" 
                class="form-input has-prefix" 
                placeholder="9876543210" 
                maxlength="10" 
                pattern="[0-9]{10}" 
                required 
                autocomplete="tel"
              >
            </div>
          </div>

          <!-- 3. Area / Locality Field -->
          <div class="form-group">
            <label for="regLocality" class="form-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
              Area / Locality in Karnataka
            </label>
            <div class="form-input-wrap">
              <input 
                type="text" 
                id="regLocality" 
                name="locality" 
                class="form-input" 
                placeholder="e.g. Puttur, Dakshina Kannada" 
                list="karnatakaPlacesDatalist" 
                required 
                autocomplete="address-level2"
              >
            </div>
            <datalist id="karnatakaPlacesDatalist">
              <option value="Puttur, Dakshina Kannada">Puttur (Dakshina Kannada)</option>
              <option value="Bantwal, Dakshina Kannada">Bantwal (Dakshina Kannada)</option>
              <option value="Mangaluru, Dakshina Kannada">Mangaluru (Dakshina Kannada)</option>
              <option value="Sullia, Dakshina Kannada">Sullia (Dakshina Kannada)</option>
              <option value="Belthangady, Dakshina Kannada">Belthangady (Dakshina Kannada)</option>
              <option value="Udupi, Udupi District">Udupi (Temple Town)</option>
              <option value="Manipal, Udupi District">Manipal (Ridge)</option>
              <option value="Karkala, Udupi District">Karkala (Foothills)</option>
              <option value="Bengaluru Urban">Bengaluru (Capital Hub)</option>
              <option value="Mysuru, Mysuru District">Mysuru (Heritage City)</option>
              <option value="Madikeri, Kodagu">Madikeri (Coorg Highlands)</option>
              <option value="Shivamogga">Shivamogga (Ghats Gateway)</option>
              <option value="Chikkamagaluru">Chikkamagaluru (Coffee Crest)</option>
              <option value="Hassan">Hassan (Malnad Gate)</option>
              <option value="Hubballi">Hubballi / Hubli</option>
              <option value="Belagavi">Belagavi / Belgaum</option>
            </datalist>
          </div>

          <!-- 4. Gmail / Email Field -->
          <div class="form-group">
            <label for="regEmail" class="form-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L1 7"/></svg>
              Gmail / Email Address
            </label>
            <div class="form-input-wrap">
              <input 
                type="email" 
                id="regEmail" 
                name="email" 
                class="form-input" 
                placeholder="e.g. shreyas@gmail.com" 
                required 
                autocomplete="email"
              >
            </div>
          </div>

          <!-- 5. Password Field -->
          <div class="form-group">
            <label for="regPassword" class="form-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Password (min. 6 characters)
            </label>
            <div class="form-input-wrap">
              <input 
                type="password" 
                id="regPassword" 
                name="password" 
                class="form-input" 
                placeholder="Create a secure password" 
                minlength="6" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('regPassword', this)" title="Show/Hide Password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="regSubmitBtn" class="auth-submit-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
            <span>Register & Enter Dashboard</span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login">Sign In Here</a>
        </div>
      </div>
    </main>

  </div>

  <script>
    // Theme toggle handling
    function setAppTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('aerocast_theme', theme);
      var btnLight = document.getElementById('btnLight');
      var btnDark = document.getElementById('btnDark');
      if (btnLight && btnDark) {
        btnLight.classList.toggle('active', theme === 'light');
        btnDark.classList.toggle('active', theme === 'dark');
      }
    }

    (function() {
      var savedTheme = localStorage.getItem('aerocast_theme') || 'light';
      setAppTheme(savedTheme);
    })();

    function togglePasswordVisibility(inputId, btn) {
      var input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      }
    }

    function showAlert(msg, type) {
      var box = document.getElementById('authAlertBox');
      if (!box) return;
      box.textContent = msg;
      box.className = 'auth-alert-box ' + (type === 'success' ? 'auth-alert-success' : 'auth-alert-error');
      box.style.display = 'block';
    }

    async function handleRegisterSubmit(event) {
      event.preventDefault();
      var username = document.getElementById('regUsername').value.trim();
      var mobile = document.getElementById('regMobile').value.trim();
      var locality = document.getElementById('regLocality').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value.trim();
      var submitBtn = document.getElementById('regSubmitBtn');

      if (!username || !mobile || !locality || !email || !password) {
        showAlert('Please fill in all registration fields.', 'error');
        return;
      }

      if (mobile.length !== 10 || !/^\d{10}$/.test(mobile)) {
        showAlert('Please enter a valid 10-digit mobile number.', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Creating account...</span>';

      try {
        var resp = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            mobile: mobile,
            locality: locality,
            email: email,
            password: password
          })
        });
        var data = await resp.json();

        if (resp.ok && data.success) {
          showAlert('Account registered successfully! Entering dashboard...', 'success');
          var redirectUrl = data.redirect_url || '/';
          setTimeout(function() {
            window.location.href = redirectUrl;
          }, 500);
        } else {
          showAlert(data.error || 'Registration failed. Please check your details.', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg><span>Register & Enter Dashboard</span>';
        }
      } catch (err) {
        showAlert('Network error while registering. Please verify server connection.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg><span>Register & Enter Dashboard</span>';
      }
    }
  </script>
</body>
</html>
